[basic]
graph_dir = ./graph
save_dir  = ./
raw_dir   = ../preprocess
dataset_name = test
num_threads = 8
save_to_time_folder = True
save_csv = False
seed = 42
orbital = [{"25 25": [0, 0]} ]
# 25: Mn
disable_cuda = False
device = cpu

[graph]
create_from_DFT = True

[train]
train_cutoff = 5
weight_radius = 4
weight_outer = 0.7

epochs = 100
#resume =
train_ratio = 0.5
val_ratio = 0.5
test_ratio = 0.0
revert_then_decay = True
revert_decay_epoch = [  50, 100]
revert_decay_gamma = [ 0.8, 0.6]


[hyperparameter]
batch_size = 2
learning_rate = 0.0015
criterion = LengthWeightMaskMSELoss

[network]
gauss_stop = 8.5